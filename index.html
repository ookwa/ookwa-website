<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b090a">
<title>Ookwa Social</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  color-scheme: dark;
  --bg:#0b090a; --panel:#151113; --line:#332329;
  --red:#ef3340; --text:#faf5f6; --muted:#a99ba0;
}
* {box-sizing:border-box}
body {margin:0;background:var(--bg);color:var(--text);
  font:15px/1.5 Inter,system-ui,Arial,sans-serif}
button,input,textarea {font:inherit}
button {cursor:pointer;background:#21181c;color:var(--text);
  border:1px solid var(--line);border-radius:10px;padding:10px 13px}
button:hover {border-color:var(--red)}
button:disabled {opacity:.5;cursor:wait}
.primary {background:var(--red);color:white;border-color:var(--red);font-weight:750}
input,textarea {width:100%;padding:12px;background:#0d0a0c;
  border:1px solid var(--line);border-radius:10px;color:var(--text)}
textarea {resize:vertical;min-height:90px}
header {position:sticky;top:0;z-index:5;background:#0b090af0;
  backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:14px 20px}
.top {max-width:1100px;margin:auto;display:flex;align-items:center;
  justify-content:space-between;gap:12px}
.logo {font-size:22px;font-weight:900;letter-spacing:-1px}
.logo span {color:var(--red)}
main {max-width:1100px;margin:auto;padding:24px 16px;
  display:grid;grid-template-columns:205px minmax(0,1fr);gap:20px}
.panel,.post {background:var(--panel);border:1px solid var(--line);
  border-radius:15px;padding:17px}
.sidebar {height:max-content;position:sticky;top:80px}
.nav {display:grid;gap:8px;margin-top:18px}
.nav button {text-align:left}
.nav button.active {background:#38171e;border-color:var(--red)}
.muted {color:var(--muted);font-size:13px}
h1,h2,h3,p {margin-top:0}
h2 {font-size:20px}
.stack {display:grid;gap:13px}
.feed {display:grid;gap:13px}
.posthead {display:flex;align-items:center;gap:10px;margin-bottom:12px}
.avatar {height:40px;width:40px;flex-shrink:0;border-radius:50%;
  background:#471923;color:#ffc2c7;display:grid;place-items:center;font-weight:850}
.username {font-weight:750;overflow-wrap:anywhere}
.content {white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0}
.actions {display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.comment {border-top:1px solid var(--line);padding:10px 0}
.commentform {display:flex;gap:8px;margin-top:10px}
.commentform input {min-width:0}
.hidden {display:none!important}
#auth {max-width:430px;margin:50px auto;padding:22px}
#notice {overflow-wrap:anywhere}
#conversation-list {display:grid;gap:7px}
#conversation-list button {text-align:left}
#messages {display:grid;gap:10px;max-height:350px;overflow:auto;margin:14px 0}
.bubble {max-width:85%;padding:10px 12px;border-radius:12px;
  background:#281b20;overflow-wrap:anywhere;white-space:pre-wrap}
.bubble.mine {justify-self:end;background:#74212d}
.small {font-size:12px;color:var(--muted)}
@media(max-width:700px) {
  main {grid-template-columns:1fr;padding:12px}
  .sidebar {position:static}
  .nav {display:flex;flex-wrap:wrap}
  .nav button {flex:1}
  header {padding:12px}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo">ookwa<span> social.</span></div>
    <span id="top-user" class="muted">Not signed in</span>
    <button id="logout" class="hidden">Log out</button>
  </div>
</header>

<section id="auth" class="panel">
  <h1>Welcome to Ookwa.</h1>
  <p class="muted">Your people. Your posts. Your community.</p>
  <div id="notice" class="panel hidden" role="status"></div>
  <form id="signup" class="stack">
    <h3>Create an account</h3>
    <input id="su-name" placeholder="Username (3–20 characters)"
      minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+"
      autocomplete="username" required>
    <input id="su-email" type="email" placeholder="Email" required>
    <input id="su-pass" type="password" minlength="8"
      autocomplete="new-password" placeholder="Password (8+ characters)" required>
    <button class="primary">Sign up</button>
  </form>
  <hr style="border-color:var(--line);margin:24px 0">
  <form id="signin" class="stack">
    <h3>Sign in</h3>
    <input id="li-email" type="email" autocomplete="email"
      placeholder="Email" required>
    <input id="li-pass" type="password" autocomplete="current-password"
      placeholder="Password" required>
    <button>Log in</button>
  </form>
</section>

<main id="app" class="hidden">
  <aside class="panel sidebar">
    <div class="avatar" id="my-avatar">O</div>
    <h3 id="my-name" style="margin-top:10px">My profile</h3>
    <p class="muted">Welcome to your community.</p>
    <div class="nav">
      <button data-page="feed" class="active">⌂ Feed</button>
      <button data-page="profile">◉ Profile</button>
      <button data-page="following">♡ Following</button>
      <button data-page="messages">✉ Messages</button>
    </div>
  </aside>

  <section id="page" class="stack"></section>
</main>

<script>
/* Replace these two placeholders with your own Supabase values. */
const SUPABASE_URL = "https://xnqzetzrvhzhxjllsaru.supabase.co";
const SUPABASE_KEY = "sb_publishable_O1HALKKAVHyodKB1dZy19g_ka43iIhW";

const configured = SUPABASE_URL.startsWith("https://")
  && !SUPABASE_URL.includes("YOUR_")
  && !SUPABASE_KEY.includes("YOUR_");

const db = configured
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
  : null;

const $ = id => document.getElementById(id);
let user = null, profile = null, page = "feed";
let following = new Set(), activeConversation = null;
let conversationUsers = new Map();

function el(tag, text, cls) {
  const n = document.createElement(tag);
  if (text !== undefined) n.textContent = text;
  if (cls) n.className = cls;
  return n;
}
function button(text, fn, cls = "") {
  const b = el("button", text, cls);
  b.type = "button";
  b.addEventListener("click", fn);
  return b;
}
function field(placeholder, value = "") {
  const n = document.createElement("input");
  n.placeholder = placeholder;
  n.value = value;
  return n;
}
function area(placeholder, value = "") {
  const n = el("textarea");
  n.placeholder = placeholder;
  n.value = value;
  return n;
}
function form(...children) {
  const f = el("form", undefined, "stack");
  children.forEach(n => f.append(n));
  return f;
}
function notice(message) {
  $("notice").textContent = message;
  $("notice").classList.remove("hidden");
}
function showError(error) {
  console.error(error);
  alert(error.message || "Something went wrong.");
}
function heading(text, description) {
  const box = el("div");
  box.append(el("h2", text));
  if (description) box.append(el("p", description, "muted"));
  return box;
}
function avatar(name) {
  return el("div", (name || "?")[0].toUpperCase(), "avatar");
}
function switchPage(next) {
  page = next;
  activeConversation = null;
  document.querySelectorAll("[data-page]").forEach(b =>
    b.classList.toggle("active", b.dataset.page === next));
  renderPage();
}
async function loadProfile() {
  const { data, error } = await db.from("profiles")
    .select("*").eq("id", user.id).single();
  if (error) throw error;
  profile = data;
  $("my-name").textContent = "@" + profile.username;
  $("my-avatar").textContent = profile.username[0].toUpperCase();
  $("top-user").textContent = "@" + profile.username;
}
async function loadFollowing() {
  const { data, error } = await db.from("follows")
    .select("following_id").eq("follower_id", user.id);
  if (error) throw error;
  following = new Set(data.map(x => x.following_id));
}
async function renderPage() {
  const root = $("page");
  root.replaceChildren(el("div", "Loading...", "panel"));
  try {
    if (page === "feed") await renderFeed(root, false);
    if (page === "profile") await renderProfile(root);
    if (page === "following") await renderFollowing(root);
    if (page === "messages") await renderMessages(root);
  } catch (e) {
    root.replaceChildren(el("div", e.message, "panel"));
  }
}
async function renderFeed(root, onlyFollowing) {
  const composer = el("section", undefined, "panel stack");
  composer.append(heading("What's happening?", "Share an update with your community."));
  const f = form();
  const content = area("Write a post... (up to 1000 characters)");
  content.maxLength = 1000;
  const publish = el("button", "Publish post", "primary");
  f.append(content, publish);
  f.addEventListener("submit", async e => {
    e.preventDefault();
    if (!content.value.trim()) return;
    publish.disabled = true;
    try {
      const { error } = await db.from("posts").insert({
        user_id: user.id, content: content.value.trim()
      });
      if (error) throw error;
      await renderPage();
    } catch (e) { showError(e); }
    finally { publish.disabled = false; }
  });
  composer.append(f);
  root.replaceChildren(composer);

  const { data: posts, error } = await db.from("posts")
    .select("id,user_id,content,created_at,profiles(username,bio)")
    .order("created_at", { ascending: false }).limit(50);
  if (error) throw error;

  const ids = (posts || []).map(p => p.id);
  let likes = [], comments = [];
  if (ids.length) {
    const a = await db.from("likes").select("post_id,user_id").in("post_id", ids);
    if (a.error) throw a.error;
    likes = a.data;
    const c = await db.from("comments")
      .select("id,post_id,user_id,content,created_at,profiles(username)")
      .in("post_id", ids).order("created_at");
    if (c.error) throw c.error;
    comments = c.data;
  }

  const filtered = onlyFollowing
    ? posts.filter(p => following.has(p.user_id) || p.user_id === user.id)
    : posts;

  if (!filtered.length) {
    root.append(el("div", onlyFollowing
      ? "No posts from people you follow yet."
      : "No posts yet. Be the first to publish!", "panel"));
    return;
  }

  for (const p of filtered) {
    const author = p.profiles?.username || "member";
    const card = el("article", undefined, "post");
    const head = el("div", undefined, "posthead");
    head.append(avatar(author));
    const info = el("div");
    info.append(el("div", "@" + author, "username"),
      el("div", new Date(p.created_at).toLocaleString(), "small"));
    head.append(info);
    card.append(head, el("div", p.content, "content"));

    const actions = el("div", undefined, "actions");
    const postLikes = likes.filter(x => x.post_id === p.id);
    const liked = postLikes.some(x => x.user_id === user.id);
    actions.append(button((liked ? "♥" : "♡") +
      " Like · " + postLikes.length, async () => {
      try {
        const result = liked
          ? await db.from("likes").delete().eq("post_id", p.id).eq("user_id", user.id)
          : await db.from("likes").insert({post_id:p.id,user_id:user.id});
        if (result.error) throw result.error;
        await renderPage();
      } catch (e) { showError(e); }
    }));

    if (p.user_id !== user.id) {
      actions.append(button(following.has(p.user_id) ? "Following ✓" : "+ Follow",
        async () => {
          try {
            const result = following.has(p.user_id)
              ? await db.from("follows").delete()
                  .eq("follower_id", user.id).eq("following_id", p.user_id)
              : await db.from("follows").insert({
                  follower_id: user.id, following_id: p.user_id
                });
            if (result.error) throw result.error;
            await loadFollowing();
            await renderPage();
          } catch (e) { showError(e); }
        }));
      actions.append(button("Message", () => startConversation(p.user_id)));
    } else {
      actions.append(button("Delete post", async () => {
        if (!confirm("Delete this post?")) return;
        const { error } = await db.from("posts").delete().eq("id", p.id);
        if (error) showError(error); else await renderPage();
      }));
    }
    card.append(actions);

    const commentList = el("div");
    for (const c of comments.filter(x => x.post_id === p.id)) {
      const row = el("div", undefined, "comment");
      row.append(el("b", "@" + (c.profiles?.username || "member") + " "));
      row.append(document.createTextNode(c.content));
      if (c.user_id === user.id) {
        row.append(document.createTextNode(" "));
        row.append(button("Delete", async () => {
          const { error } = await db.from("comments").delete().eq("id", c.id);
          if (error) showError(error); else await renderPage();
        }));
      }
      commentList.append(row);
    }
    const cf = el("form", undefined, "commentform");
    const ci = field("Write a comment...");
    ci.maxLength = 500;
    const cb = el("button", "Send", "primary");
    cf.append(ci, cb);
    cf.addEventListener("submit", async e => {
      e.preventDefault();
      if (!ci.value.trim()) return;
      cb.disabled = true;
      try {
        const { error } = await db.from("comments").insert({
          post_id: p.id, user_id: user.id, content: ci.value.trim()
        });
        if (error) throw error;
        await renderPage();
      } catch (e) { showError(e); }
      finally { cb.disabled = false; }
    });
    card.append(el("h3", "Comments"), commentList, cf);
    root.append(card);
  }
}
async function renderProfile(root) {
  const box = el("section", undefined, "panel stack");
  box.append(heading("Your profile", "Edit how people see you."));
  const name = field("Username", profile.username);
  name.minLength = 3; name.maxLength = 20;
  const bio = area("Tell people about yourself...", profile.bio || "");
  bio.maxLength = 250;
  const save = el("button", "Save profile", "primary");
  const f = form(name, bio, save);
  f.addEventListener("submit", async e => {
    e.preventDefault();
    const username = name.value.trim().toLowerCase();
    if (!/^[a-z0-9_]{3,20}$/.test(username)) {
      alert("Use 3–20 letters, numbers, or underscores."); return;
    }
    save.disabled = true;
    try {
      const { error } = await db.from("profiles")
        .update({username, bio:bio.value.trim()}).eq("id", user.id);
      if (error) throw error;
      await loadProfile();
      alert("Profile saved!");
      await renderPage();
    } catch (e) { showError(e); }
    finally { save.disabled = false; }
  });
  box.append(f);
  const [followers, followingRows, posts] = await Promise.all([
    db.from("follows").select("follower_id").eq("following_id", user.id),
    db.from("follows").select("following_id").eq("follower_id", user.id),
    db.from("posts").select("id").eq("user_id", user.id)
  ]);
  for (const r of [followers, followingRows, posts]) if (r.error) throw r.error;
  box.append(el("p",
    `${posts.data.length} posts · ${followers.data.length} followers · ${followingRows.data.length} following`,
    "muted"));
  root.replaceChildren(box);
}
async function renderFollowing(root) {
  root.replaceChildren(heading("Following", "Posts from people you follow."));
  await renderFeed(root, true);
}
async function startConversation(otherId) {
  if (otherId === user.id) return;
  try {
    const {data: existing, error: findError} = await db.from("conversations")
      .select("*").or(
        `and(user1_id.eq.${user.id},user2_id.eq.${otherId}),and(user1_id.eq.${otherId},user2_id.eq.${user.id})`
      ).limit(1);
    if (findError) throw findError;
    let conversation = existing[0];
    if (!conversation) {
      const {data, error} = await db.from("conversations").insert({
        user1_id:user.id,user2_id:otherId
      }).select().single();
      if (error) throw error;
      conversation = data;
    }
    activeConversation = conversation.id;
    conversationUsers.set(conversation.id, otherId);
    switchPage("messages");
  } catch (e) { showError(e); }
}
async function renderMessages(root) {
  const wrap = el("div", undefined, "stack");
  wrap.append(heading("Direct messages", "Private messages between your account and another user."));
  const searchForm = el("form", undefined, "commentform");
  const search = field("Find someone by exact username");
  const find = el("button", "Find user", "primary");
  searchForm.append(search, find);
  const result = el("div", undefined, "stack");
  searchForm.addEventListener("submit", async e => {
    e.preventDefault();
    const term = search.value.trim().toLowerCase();
    if (!term) return;
    const {data, error} = await db.from("profiles")
      .select("id,username").eq("username", term).limit(1);
    if (error) return showError(error);
    result.replaceChildren();
    if (!data.length) result.append(el("p", "No user found.", "muted"));
    else if (data[0].id === user.id) result.append(el("p", "That's your own username.", "muted"));
    else result.append(el("div", undefined, "panel"),
      button("Message @" + data[0].username, () => startConversation(data[0].id)));
  });
  wrap.append(searchForm, result);
  const list = el("div", undefined, "panel stack");
  list.append(el("h3", "Your conversations"));
  const {data: conversations, error} = await db.from("conversations")
    .select("*").or(`user1_id.eq.${user.id},user2_id.eq.${user.id}`)
    .order("created_at", {ascending:false});
  if (error) throw error;
  for (const c of conversations) {
    const other = c.user1_id === user.id ? c.user2_id : c.user1_id;
    let name = "Conversation";
    const cached = conversationUsers.get(c.id);
    if (cached) {
      const {data} = await db.from("profiles").select("username").eq("id", cached).maybeSingle();
      if (data) name = "@" + data.username;
    } else {
      const {data} = await db.from("profiles").select("username").eq("id", other).maybeSingle();
      if (data) name = "@" + data.username;
    }
    list.append(button(name, () => {
      activeConversation = c.id;
      conversationUsers.set(c.id, other);
      renderPage();
    }));
  }
  wrap.append(list);
  if (activeConversation) {
    const chat = el("section", undefined, "panel stack");
    chat.append(heading("Chat", "Only participants can read messages."));
    const messages = el("div", undefined, "stack");
    messages.id = "messages";
    const {data: rows, error: msgError} = await db.from("messages")
      .select("*").eq("conversation_id", activeConversation)
      .order("created_at").limit(100);
    if (msgError) throw msgError;
    for (const m of rows) {
      const bubble = el("div", m.content, "bubble" + (m.sender_id === user.id ? " mine" : ""));
      bubble.append(el("div", new Date(m.created_at).toLocaleString(), "small"));
      messages.append(bubble);
    }
    chat.append(messages);
    const mf = el("form", undefined, "commentform");
    const input = field("Write a private message...");
    input.maxLength = 2000;
    const send = el("button", "Send", "primary");
    mf.append(input, send);
    mf.addEventListener("submit", async e => {
      e.preventDefault();
      if (!input.value.trim()) return;
      send.disabled = true;
      try {
        const {error} = await db.from("messages").insert({
          conversation_id:activeConversation,
          sender_id:user.id,
          content:input.value.trim()
        });
        if (error) throw error;
        await renderPage();
      } catch (e) { showError(e); }
      finally { send.disabled = false; }
    });
    chat.append(mf);
    wrap.append(chat);
  }
  root.replaceChildren(wrap);
}

$("signup").addEventListener("submit", async e => {
  e.preventDefault();
  if (!configured) return notice("Add your Supabase URL and publishable key to the code first.");
  const username = $("su-name").value.trim().toLowerCase();
  if (!/^[a-z0-9_]{3,20}$/.test(username))
    return notice("Username must be 3–20 letters, numbers or underscores.");
  try {
    const {data, error} = await db.auth.signUp({
      email:$("su-email").value.trim(),
      password:$("su-pass").value,
      options:{data:{username}}
    });
    if (error) throw error;
    if (!data.session) notice("Check your email to confirm your account, & sign in.");
    else notice("Account created!");
  } catch (e) { notice(e.message); }
});
$("signin").addEventListener("submit", async e => {
  e.preventDefault();
  if (!configured) return notice("Add your Supabase URL and publishable key to the code first.");
  try {
    const {error} = await db.auth.signInWithPassword({
      email:$("li-email").value.trim(),
      password:$("li-pass").value
    });
    if (error) throw error;
  } catch (e) { notice(e.message); }
});

$("signup").addEventListener("submit", async e => {
  e.preventDefault();

  if (!configured) {
    return notice("Supabase setup is missing. Check your project URL and publishable key.");
  }

  const username = $("su-name").value.trim().toLowerCase();
  const email = $("su-email").value.trim();
  const password = $("su-pass").value;
  const submitButton = $("signup").querySelector("button");

  if (!/^[a-z0-9_]{3,20}$/.test(username)) {
    return notice("Username must be 3–20 letters, numbers or underscores.");
  }

  if (password.length < 8) {
    return notice("Your password must be at least 8 characters.");
  }

  submitButton.disabled = true;
  submitButton.textContent = "Creating account...";

  try {
    notice("Creating your account...");

    const { data, error } = await db.auth.signUp({
      email,
      password,
      options: {
        data: { username }
      }
    });

    if (error) throw error;

    if (data.session) {
      notice("Account created! Loading Ookwa Social...");
    } else {
      notice(
        "Signup request completed. If email confirmation is enabled, check your inbox and spam folder. If no email arrives, check your Supabase email settings."
      );
    }
  } catch (error) {
    console.error("Ookwa Social signup failed:", error);
    notice(error.message || "Signup failed. Please try again.");
  } finally {
    submitButton.disabled = false;
    submitButton.textContent = "Sign up";
  }
});
  const {error} = await db.auth.signOut();
  if (error) showError(error);
});
document.querySelectorAll("[data-page]").forEach(b =>
  b.addEventListener("click", () => switchPage(b.dataset.page)));

async function boot() {
  if (!configured) {
    notice("Setup required: add your Supabase project URL and publishable key.");
    return;
  }
  const {data, error} = await db.auth.getSession();
  if (error) showError(error);
  await setSession(data.session);
  db.auth.onAuthStateChange((_event, session) => {
    setTimeout(() => setSession(session), 0);
  });
}
async function setSession(session) {
  user = session?.user || null;
  $("auth").classList.toggle("hidden", !!user);
  $("app").classList.toggle("hidden", !user);
  $("logout").classList.toggle("hidden", !user);
  if (!user) {
    profile = null;
    $("top-user").textContent = "Not signed in";
    return;
  }
  try {
    await loadProfile();
    await loadFollowing();
    await renderPage();
  } catch (e) { showError(e); }
}
boot();
</script>
</body>
</html>
